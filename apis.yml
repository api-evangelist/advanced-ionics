aid: advanced-ionics
name: Advanced Ionics
description: 'Advanced Ionics is a Milwaukee, Wisconsin based clean-energy hardware company
  developing the Symbion water-vapor electrolyzer, a green hydrogen production technology
  that uses process and waste heat together with low-cost renewable or nuclear electricity
  to cut the energy needed per kilogram of hydrogen to roughly 35 kWh, well below the
  50-plus kWh required by conventional commercial electrolyzers. Founded in 2017 and
  relocated to Milwaukee in 2018, the company targets decarbonization of heavy industry
  — steel, ammonia, refining and other hydrogen-intensive sectors — and has run pilot and
  demonstration projects with Shell through its GameChanger program and with the
  Entrepreneurs Fund of the Repsol Foundation, and signed a collaboration MOU with ACWA
  Power. Advanced Ionics manufactures electrolyzer hardware; it does not operate a public
  developer program, and no public API, SDK, or machine-readable specification was found.'
